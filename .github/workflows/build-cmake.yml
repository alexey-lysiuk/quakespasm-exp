name: CMake CI

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux ARM Clang
            os: ubuntu-24.04-arm
            extra_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

          - name: Linux ARM GCC
            os: ubuntu-24.04-arm

          - name: Linux Intel Clang
            os: ubuntu-24.04
            extra_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

          - name: Linux Intel GCC
            os: ubuntu-24.04

          - name: macOS ARM
            os: macos-26

          - name: macOS Intel
            os: macos-26-intel

          - name: MSVC 32-bit
            os: windows-2025
            extra_options: -A Win32

          - name: MSVC 64-bit
            os: windows-2025

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          if [[ "${{ runner.os }}" == 'Linux' ]]; then
            sudo apt update && sudo apt install libflac-dev libmpg123-dev libopusfile-dev libsdl2-dev libvorbis-dev libxmp-dev
          elif [[ "${{ runner.os }}" == 'macOS' ]]; then
            brew install flac libvorbis libxmp mpg123 opusfile sdl2
          fi

      - name: Configure
        run: |
          extra_options="${{ matrix.config.extra_options }}"

          if [[ "${{ runner.os }}" != 'Windows' ]]; then
            extra_options="$extra_options -G Ninja"
          fi
          
          cmake -B build -DQUAKE_WARNINGS_AS_ERRORS=ON -DQUAKE_GENERATE_VERSION_HEADER=ON $extra_options

      - name: Build
        run: |
          cmake --build build --config Release

      - name: List Build Directory
        if: always()
        run: |
          cat build/expversion.h
          git status
          ls -lR build
